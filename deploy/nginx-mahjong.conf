server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Existing FRP forwards public :5173 (and :80) to this frontend port.
    listen 127.0.0.1:5173;
    server_name _;

    root /var/www/mahjong-yaoming-20260907;
    index index.html;

    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Yaoming SSE carries version notifications; never buffer the event stream.
        proxy_buffering off;
    }

    # Retired transport must not fall through to the Vue SPA entry.
    location /ws { return 404; }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
